<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            margin: 50px;
        }
        div{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: absolute;
        }
        .blue{
            background-color: blue;
            left: 40px;
        }
        .red{
            background-color: red;
            left: 80px;
            z-index: 20;
        }
        .green{
            background-color: green;
            left: 120px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="blue"></div>
        <div class="red"></div>
        <div class="green"></div>

    </div>
</body>
</html>
