<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: yellow;
            position: relative;
            animation: movingbox;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-delay: 2s;
            animation-direction: alternate;
            background-size: 100% 100%;
        }
        
        /* @keyframes movingbox{
            0%{background-color: yellow;left: 0px;top: 0px;}
            25%{background-color: red;left: 300px;top: 0px;}
            50%{background-color: blue;left: 300px;top: 300px;}
            75%{background-color: green;left: 0px;top: 300px;}
            100%{background-color: yellow;left: 0px;top: 0px;}
        } */
        /* Background-Img */
        
        @keyframes movingbox{
            0%{background-image: url(images/shoes.webp);left: 0px;top: 0px;}
            25%{background-image: url(images/shoes1.jpeg);left: 300px;top: 0px;}
            50%{background-image: url(images/shoes2.jpeg);left: 300px;top: 300px;}
            75%{background-image: url(images/shoes3.jpeg);left: 0px;top: 300px;}
            100%{background-image: url(images/flower.jpeg);left: 0px;top: 0px;}
        }
    </style>
</head>
<body>
    <div>
        
    </div>
</body>
</html>
